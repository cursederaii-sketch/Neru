<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultados de la encuesta — Salud mental y fútbol</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Fraunces:wght@400;500&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --display: 'Big Shoulders Display', sans-serif;
    --body: 'Fraunces', serif;
    --mono: 'IBM Plex Mono', monospace;
    --night: #0D1512;
    --night-panel: rgba(17, 28, 22, 0.85);
    --night-ink: #E9EFE3;
    --night-dim: #8C9A87;
    --turf-glow: #349662;
    --danger-glow: #e04f35;
    --caution: #C98A1E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--body);
    background-color: var(--night);
    color: var(--night-ink);
    min-height: 100vh;
    padding: 40px 30px 60px;
  }
  a { color: inherit; }
  .btn {
    background: var(--night-panel);
    color: var(--night-ink);
    border: 1px solid var(--caution);
    padding: 8px 16px;
    font-family: var(--mono);
    font-size: 12px;
    text-transform: uppercase;
    border-radius: 4px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: background 0.3s, color 0.3s;
  }
  .btn:hover { background: var(--caution); color: var(--night); }
  .results-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 16px;
    max-width: 1200px;
    margin: 0 auto 8px;
  }
  .kicker {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--caution);
    margin-bottom: 6px;
  }
  .results-header h2 {
    font-family: var(--display);
    font-size: clamp(1.6rem, 3.4vw, 2.4rem);
    text-transform: uppercase;
    line-height: 1;
  }
  .results-header-actions { display: flex; align-items: center; gap: 12px; }
  .results-updated {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--night-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .results-status {
    max-width: 1200px;
    margin: 0 auto 20px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--night-dim);
    min-height: 16px;
  }
  .results-status.error { color: var(--danger-glow); line-height: 1.6; }
  .results-status-link { display: inline-block; margin-left: 8px; color: var(--danger-glow); text-decoration: underline; white-space: nowrap; }
  .results-status-link:hover { color: var(--night-ink); }
  .results-grid {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
  }
  .chart-card {
    background: var(--night-panel);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    padding: 18px 20px;
    animation: chart-card-in 0.5s ease both;
  }
  @keyframes chart-card-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .chart-card h4 { font-family: var(--body); font-weight: 500; font-size: 15px; line-height: 1.3; margin-bottom: 14px; color: var(--night-ink); }
  .donut-chart { display: flex; align-items: center; gap: 20px; }
  .donut-svg { width: 110px; height: 110px; flex-shrink: 0; }
  .donut-track { fill: none; stroke: rgba(255, 255, 255, 0.06); stroke-width: 16; }
  .donut-segment { fill: none; stroke-width: 16; stroke-linecap: butt; transform-origin: 60px 60px; transform: rotate(-90deg); opacity: 0; animation: donut-segment-in 0.6s ease forwards; }
  @keyframes donut-segment-in { from { opacity: 0; } to { opacity: 1; } }
  .donut-legend { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1; }
  .legend-item { display: grid; grid-template-columns: 9px minmax(0, 1fr) 34px; align-items: center; gap: 8px; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .legend-label { font-family: var(--mono); font-size: 11px; color: var(--night-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-value { font-family: var(--mono); font-size: 11px; color: var(--night-dim); text-align: right; }
  .chart-meta { margin-top: 12px; font-family: var(--mono); font-size: 10px; color: var(--night-dim); text-transform: uppercase; letter-spacing: 0.04em; }
  .chart-empty { font-family: var(--mono); font-size: 12px; color: var(--night-dim); }
  .freetext-section { max-width: 1200px; margin: 34px auto 0; }
  .freetext-heading { font-family: var(--body); font-weight: 500; font-size: 17px; color: var(--night-ink); margin: 0 0 16px; padding-top: 18px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
  .freetext-grid { margin: 0; }
  .freetext-card h4 { margin-bottom: 10px; }
  .freetext-list { display: flex; flex-direction: column; gap: 10px; max-height: 260px; overflow-y: auto; padding-right: 6px; }
  .freetext-answer { font-family: var(--body); font-size: 13px; line-height: 1.5; color: var(--night-dim); font-style: italic; border-left: 2px solid rgba(255, 255, 255, 0.12); padding-left: 10px; }
  @media (max-width: 768px) {
    .donut-chart { flex-direction: column; align-items: stretch; gap: 14px; }
    .donut-svg { align-self: center; }
    .legend-item { grid-template-columns: 9px minmax(0, 1fr) 30px; }
  }
</style>
</head>
<body>

  <div class="results-header">
    <div>
      <p class="kicker">En vivo · Google Sheets</p>
      <h2>Resultados de la encuesta</h2>
    </div>
    <div class="results-header-actions">
      <span id="results-updated" class="results-updated"></span>
      <button id="results-refresh" class="btn" aria-label="Actualizar datos">↻ Actualizar</button>
      <a href="index.html" class="btn" aria-label="Volver al globo">← Volver al globo</a>
    </div>
  </div>
  <p id="results-status" class="results-status"></p>
  <div id="results-grid" class="results-grid"></div>
  <div id="freetext-section" class="freetext-section"></div>

<script>
// =====================================================================
// PANEL DE RESULTADOS (página independiente): mismo código que usaba el
// panel dentro del globo, ahora en su propia página para no depender del
// CSS/estado de la página principal.
// =====================================================================

const SURVEY_SHEET_ID = '1pxGsgWGJFvTc6pmnCGZel-nn_cDDIA2NsrH19EN-rb8';
const SURVEY_GID = '277764764';

const surveyQuestions = [
  { col: 1, type: 'single', label: 'Edad' },
  { col: 2, type: 'single', label: 'Deporte que practica' },
  { col: 3, type: 'single', label: 'Frecuencia con la que practica deporte' },
  { col: 4, type: 'single', label: 'Cómo influye el deporte en su salud mental' },
  { col: 5, type: 'single', label: 'Frecuencia de presión por obtener resultados' },
  { col: 6, type: 'single', label: '¿Sintió ansiedad o estrés antes de competir?' },
  { col: 7, type: 'multi', label: 'Qué situaciones le generan más presión' },
  { col: 8, type: 'single', label: 'Cómo afecta una derrota su estado de ánimo' },
  { col: 9, type: 'single', label: '¿Le preocupa cometer errores en competición?' },
  { col: 10, type: 'single', label: '¿Su entrenador le brinda apoyo emocional?' },
  { col: 11, type: 'single', label: '¿Le resulta fácil hablar de sus emociones en el equipo?' },
  { col: 12, type: 'single', label: '¿Reciben los deportistas suficiente apoyo psicológico?' },
  { col: 13, type: 'multi', label: 'Aspectos positivos que aporta el deporte' },
  { col: 14, type: 'single', label: 'Importancia de la salud mental (1 a 5)' }
];

const chartPalette = ['#349662', '#C98A1E', '#e04f35', '#8C9A87', '#5B9BD5'];
let surveyLoading = false;

function loadSurveyResponses(callback) {
  const callbackName = '__surveyGvizCallback_' + Date.now();
  let settled = false;

  const cleanup = (scriptEl) => {
    delete window[callbackName];
    if (scriptEl && scriptEl.parentNode) scriptEl.remove();
  };

  window[callbackName] = (json) => {
    if (settled) return;
    settled = true;
    cleanup(scriptEl);
    callback(null, json);
  };

  const scriptEl = document.createElement('script');
  scriptEl.src = `https://docs.google.com/spreadsheets/d/${SURVEY_SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${callbackName}&gid=${SURVEY_GID}&_=${Date.now()}`;
  scriptEl.onerror = () => {
    if (settled) return;
    settled = true;
    cleanup(scriptEl);
    console.error('[encuesta] Falló la carga del script JSONP de Google Sheets.');
    callback(new Error('network'));
  };
  document.body.appendChild(scriptEl);

  setTimeout(() => {
    if (settled) return;
    settled = true;
    cleanup(scriptEl);
    console.error('[encuesta] Tiempo de espera agotado esperando la respuesta de Google Sheets.');
    callback(new Error('timeout'));
  }, 9000);
}

function gvizToRows(json) {
  const rows = json.table && json.table.rows ? json.table.rows : [];
  return rows.map(r => (r.c || []).map(cell => (cell && (cell.f !== undefined && cell.f !== null ? cell.f : cell.v)) || ''));
}

function gvizToHeaders(json) {
  const cols = json.table && json.table.cols ? json.table.cols : [];
  return cols.map(c => (c && c.label) || '');
}

function tallyAnswers(rows, question) {
  const counts = {};
  let total = 0;
  rows.forEach(row => {
    const raw = row[question.col];
    if (raw === undefined || raw === null || String(raw).trim() === '') return;
    if (question.type === 'multi') {
      String(raw).split(',').map(s => s.trim()).filter(Boolean).forEach(v => {
        counts[v] = (counts[v] || 0) + 1;
      });
    } else {
      const v = String(raw).trim();
      counts[v] = (counts[v] || 0) + 1;
    }
    total++;
  });
  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  return { entries, total };
}

const DONUT_R = 48;
const DONUT_CIRC = 2 * Math.PI * DONUT_R;

function renderChartCard(question, rows, colorIndex, delayIndex) {
  const { entries, total } = tallyAnswers(rows, question);
  const card = document.createElement('div');
  card.className = 'chart-card';
  card.style.animationDelay = `${Math.min(delayIndex * 0.05, 0.5)}s`;

  if (entries.length === 0) {
    card.innerHTML = `<h4>${question.label}</h4><p class="chart-empty">Todavía no hay respuestas.</p>`;
    return card;
  }

  const TOP_N = 7;
  let shown = entries.slice(0, TOP_N);
  const restCount = entries.slice(TOP_N).reduce((sum, [, c]) => sum + c, 0);
  if (restCount > 0) shown = [...shown, [`Otras respuestas (${entries.length - TOP_N})`, restCount]];

  let cumulative = 0;
  const segmentsHtml = shown.map(([, count], i) => {
    const frac = total ? count / total : 0;
    const len = frac * DONUT_CIRC;
    const offset = -cumulative;
    cumulative += len;
    const color = chartPalette[i % chartPalette.length];
    return `<circle class="donut-segment" cx="60" cy="60" r="${DONUT_R}"
      stroke="${color}"
      stroke-dasharray="${len.toFixed(2)} ${(DONUT_CIRC - len).toFixed(2)}"
      stroke-dashoffset="${offset.toFixed(2)}"
      style="animation-delay:${(i * 0.08).toFixed(2)}s"></circle>`;
  }).join('');

  const legendHtml = shown.map(([label, count], i) => {
    const pct = total ? Math.round((count / total) * 100) : 0;
    const color = chartPalette[i % chartPalette.length];
    return `
      <div class="legend-item">
        <span class="legend-dot" style="background:${color}"></span>
        <span class="legend-label" title="${label}">${label}</span>
        <span class="legend-value">${pct}%</span>
      </div>`;
  }).join('');

  card.innerHTML = `
    <h4>${question.label}</h4>
    <div class="donut-chart">
      <svg viewBox="0 0 120 120" class="donut-svg">
        <circle class="donut-track" cx="60" cy="60" r="${DONUT_R}"></circle>
        ${segmentsHtml}
      </svg>
      <div class="donut-legend">${legendHtml}</div>
    </div>
    <p class="chart-meta">${total} respuesta${total === 1 ? '' : 's'}</p>`;
  return card;
}

function renderSurveyCharts(rows) {
  const grid = document.getElementById('results-grid');
  grid.innerHTML = '';
  surveyQuestions.forEach((q, i) => {
    grid.appendChild(renderChartCard(q, rows, i, i));
  });
}

const chartedCols = new Set(surveyQuestions.map(q => q.col));

function getFreeTextColumns(headers, rows) {
  const maxCol = Math.max(headers.length, ...rows.map(r => r.length), 0);
  const cols = [];
  for (let c = 1; c < maxCol; c++) {
    if (chartedCols.has(c)) continue;
    cols.push({ col: c, label: headers[c] || `Pregunta ${c}` });
  }
  return cols;
}

function renderFreeTextCard(question, rows, delayIndex) {
  const answers = rows
    .map(r => (r[question.col] || '').toString().trim())
    .filter(Boolean);

  const card = document.createElement('div');
  card.className = 'chart-card freetext-card';
  card.style.animationDelay = `${Math.min(delayIndex * 0.05, 0.5)}s`;

  if (answers.length === 0) {
    card.innerHTML = `<h4>${question.label}</h4><p class="chart-empty">Todavía no hay respuestas.</p>`;
    return card;
  }

  const answersHtml = answers.map(a => `<p class="freetext-answer">"${a}"</p>`).join('');

  card.innerHTML = `
    <h4>${question.label}</h4>
    <div class="freetext-list">${answersHtml}</div>
    <p class="chart-meta">${answers.length} respuesta${answers.length === 1 ? '' : 's'}</p>`;
  return card;
}

function renderFreeTextSection(headers, rows) {
  const section = document.getElementById('freetext-section');
  section.innerHTML = '';
  const freeCols = getFreeTextColumns(headers, rows);
  if (freeCols.length === 0) return;

  const heading = document.createElement('h3');
  heading.className = 'freetext-heading';
  heading.textContent = 'Respuestas en sus propias palabras';
  section.appendChild(heading);

  const grid = document.createElement('div');
  grid.className = 'results-grid freetext-grid';
  freeCols.forEach((q, i) => {
    grid.appendChild(renderFreeTextCard(q, rows, i));
  });
  section.appendChild(grid);
}

function refreshSurveyPanel() {
  if (surveyLoading) return;
  surveyLoading = true;
  const statusEl = document.getElementById('results-status');
  const updatedEl = document.getElementById('results-updated');
  statusEl.textContent = 'Cargando respuestas…';
  statusEl.classList.remove('error');

  loadSurveyResponses((err, json) => {
    surveyLoading = false;
    if (err) {
      const sheetUrl = `https://docs.google.com/spreadsheets/d/${SURVEY_SHEET_ID}/edit`;
      statusEl.innerHTML = `No se pudo cargar la planilla. Lo más probable es que no esté compartida como
        <strong>"Cualquier persona con el enlace puede ver"</strong>.
        <a href="${sheetUrl}" target="_blank" rel="noopener" class="results-status-link">Abrir la planilla y revisar el acceso ↗</a>`;
      statusEl.classList.add('error');
      return;
    }
    try {
      const rows = gvizToRows(json);
      const headers = gvizToHeaders(json);
      renderSurveyCharts(rows);
      renderFreeTextSection(headers, rows);
      statusEl.textContent = '';
      updatedEl.textContent = `Actualizado ${new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' })}`;
    } catch (e) {
      console.warn('Error interpretando la respuesta de la planilla:', e);
      statusEl.textContent = 'La planilla respondió, pero no se pudo interpretar el formato.';
      statusEl.classList.add('error');
    }
  });
}

document.getElementById('results-refresh').addEventListener('click', refreshSurveyPanel);
refreshSurveyPanel();
</script>
</body>
</html>
