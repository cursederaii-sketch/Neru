<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Globo Interactivo — Salud mental y fútbol</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Fraunces:wght@400;500&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Dependencias de Globe.gl (versiones fijas: la build "latest" de three ya no expone
       un global THREE compatible con <script> clásico, por eso se pinnean versiones) -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl@2.27.2/dist/globe.gl.min.js"></script>
</head>
<body>

  <!-- Contenedor del globo 3D -->
  <div id="globe-container"></div>

  <!-- Interfaz de usuario superpuesta -->
  <div class="ui-layer">
    <header class="header">
      <p class="kicker">Vista global · Salud mental y fútbol</p>
      <h1>Cada punto<br>tiene una historia</h1>
      <div class="header-actions">
        <button id="fullscreen-btn" class="btn">Pantalla Completa</button>
        <button id="tour-btn" class="btn btn-accent">▶ Recorrido guiado</button>
        <button id="cinematic-btn" class="btn btn-cinema">🎬 Ver la historia</button>
      </div>
    </header>

    <!-- Tarjeta de información (oculta por defecto) -->
    <div id="info-card" class="info-card hidden">
      <div class="card-header">
        <span id="card-tag" class="tag"></span>
        <span id="card-year" class="year"></span>
        <button id="close-card" class="close-btn">×</button>
      </div>
      <h2 id="card-title">Título</h2>
      <h3 id="card-subtitle">Subtítulo</h3>
      <p id="card-desc">Descripción del caso o estudio.</p>
      <p id="card-source" class="source"></p>
    </div>

    <!-- Barra de estadísticas -->
    <div id="stats-bar" class="stats-bar"></div>
  </div>

  <!-- Botón para abrir el panel de controles -->
  <button id="tweaks-toggle" class="tweaks-toggle-btn" aria-label="Abrir controles del globo" aria-expanded="false" aria-controls="tweaks-panel">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>

  <!-- Panel de Ajustes (Tweaks) -->
  <div class="tweaks-panel" id="tweaks-panel">
    <div class="tweaks-header">
      <span>Controles del Globo</span>
      <button id="tweaks-close" class="tweaks-close-btn" aria-label="Cerrar controles">×</button>
    </div>

    <div class="control-group">
      <label for="search-input">Buscar país o caso</label>
      <input type="text" id="search-input" placeholder="Ej. Alemania, Iniesta...">
    </div>

    <div class="control-group">
      <label>Filtrar por categoría</label>
      <div class="filter-buttons" id="filter-buttons">
        <button class="filter-btn active" data-filter="all">Todos</button>
        <button class="filter-btn" data-filter="danger">Riesgo</button>
        <button class="filter-btn" data-filter="turf">Recuperación</button>
        <button class="filter-btn" data-filter="info">Datos globales</button>
      </div>
    </div>

    <div class="control-group">
      <label for="speed-slider">Velocidad de Rotación</label>
      <input type="range" id="speed-slider" min="0" max="2" step="0.1" value="0.5">
    </div>

    <div class="control-group">
      <label for="arc-toggle">Mostrar Flujos (Arcos)</label>
      <input type="checkbox" id="arc-toggle" checked>
    </div>

    <div class="control-group">
      <label for="atmosphere-toggle">Atmósfera Nocturna</label>
      <input type="checkbox" id="atmosphere-toggle" checked>
    </div>

    <div class="legend" id="legend">
      <div class="legend-item"><span class="dot danger"></span> Área de riesgo</div>
      <div class="legend-item"><span class="dot turf"></span> Recuperación / protección</div>
      <div class="legend-item"><span class="dot info"></span> Dato global</div>
    </div>
  </div>

  <!-- Cinemática: secuencia animada a pantalla completa -->
  <div id="cinematic" class="cinematic hidden">
    <div class="cinematic-bg"></div>
    <div class="cinematic-particles" id="cinematic-particles"></div>
    <button id="cinematic-close" class="cinematic-close">×</button>
    <div class="cinematic-visual" id="cinematic-visual">
      <svg id="cinema-svg" viewBox="0 0 300 300" width="220" height="220">
        <circle id="cinema-ring" cx="150" cy="150" r="90" fill="none" stroke-width="3"/>
        <circle id="cinema-ring-inner" cx="150" cy="150" r="76" fill="none"/>
        <g id="cinema-icon"></g>
      </svg>
    </div>
    <div class="cinematic-text">
      <p id="cinema-kicker" class="cinema-kicker"></p>
      <h2 id="cinema-title"></h2>
      <p id="cinema-body"></p>
    </div>
    <div class="cinematic-controls">
      <button id="cinema-prev" class="cinema-nav">‹</button>
      <div class="cinema-progress" id="cinema-progress"></div>
      <button id="cinema-next" class="cinema-nav">›</button>
    </div>
    <button id="cinema-skip" class="cinema-skip">Saltar</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
